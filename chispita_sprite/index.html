<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chispita Sprite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Chispita Sprite</h1>
    <div class="group">
      <label>W <input id="grid-width" type="number" min="2" max="128" value="16"></label>
      <label>H <input id="grid-height" type="number" min="2" max="128" value="16"></label>
      <button id="new-sprite">New</button>
    </div>
    <div class="group">
      <button id="save-project">Save</button>
      <button id="open-project">Open</button>
      <input id="open-file" type="file" accept=".json" hidden>
      <label>Export
        <select id="export-scale">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="4" selected>4x</option>
          <option value="8">8x</option>
        </select>
      </label>
      <button id="export-png">Export PNG</button>
    </div>
  </header>

  <main>
    <aside class="tools">
      <h2>Tool</h2>
      <div class="tool-grid">
        <button data-tool="paint" class="active" title="Paint (B)">Paint</button>
        <button data-tool="line" title="Line (L)">Line</button>
        <button data-tool="rect" title="Rectangle (R)">Rect</button>
        <button data-tool="ellipse" title="Ellipse (E)">Ellipse</button>
        <button data-tool="polygon" title="Polygon (P)">Polygon</button>
        <button data-tool="zoom" title="Zoom (Z)">Zoom</button>
      </div>
      <label>Brush size <span id="brush-value"></span>
        <input id="brush-size" type="range" min="1" max="8" step="1" value="1">
      </label>
      <label><input id="fill-shapes" type="checkbox"> Fill shapes</label>
      <label title="C"><input id="circles" type="checkbox"> Circles (C)</label>

      <h2>View <span id="zoom-value"></span></h2>
      <div class="row">
        <button id="zoom-out" title="Zoom out (-)">−</button>
        <button id="zoom-in" title="Zoom in (+)">+</button>
        <button id="zoom-fit" title="Fit (0)">Fit</button>
      </div>
      <label><input id="show-grid" type="checkbox" checked> Grid</label>

      <h2>Color</h2>
      <input id="color" type="color" value="#e04040">
      <div id="palette"></div>

      <h2>Edit</h2>
      <button id="undo">Undo</button>
      <button id="clear-layer">Clear layer</button>
      <p class="hint">
        Left: paint · Right: erase<br>
        Alt + click: pick color<br>
        [ ]: brush size · Ctrl + Z: undo<br>
        Line / Rect / Ellipse: drag<br>
        Polygon: click corners, then double-click, Enter, or click the first corner<br>
        Esc: cancel shape<br>
        Scroll: zoom
      </p>
    </aside>

    <section class="canvas-area">
      <canvas id="canvas"></canvas>
    </section>

    <aside class="layers">
      <h2>Layers</h2>
      <button id="add-layer">Add layer</button>
      <ul id="layer-list"></ul>
      <div class="circle-settings">
        <h2>Layer circles</h2>
        <label>Smooth edges <span id="layer-smoothing-value"></span>
          <input id="layer-smoothing" type="range" min="0.85" max="3" step="0.05" value="0.85">
        </label>
        <label>Color blend <span id="layer-blend-value"></span>
          <input id="layer-blend" type="range" min="0" max="1" step="0.05" value="1">
        </label>
      </div>
    </aside>
  </main>

  <script src="main.js"></script>
</body>
</html>
